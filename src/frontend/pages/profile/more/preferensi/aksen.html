<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Title Default -->
    <title>DepTech</title>

    <!-- Theme Color (Light & Dark) -->
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#2563eb">

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="DepTech">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="DepTech - Platform digital untuk belanja & menabung">

    <!-- Icon -->
    <link rel="icon" type="image/png" href="/src/frontend/assets/img/brandnolatar.png">
    <link rel="apple-touch-icon" href="/src/frontend/assets/img/brandnolatar.png">

    <!-- Framework & Font -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Days+One&family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/src/frontend/assets/css/theme.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/global.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/server.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/deptech-ui.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/deptech-settings.css">
</head>

<body class="has-canvas-bg">

    <!-- Canvas background -->
    <canvas id="bgCanvas" class="bg-canvas"></canvas>

    <div class="min-h-screen pb-[90px] page-content">

        <!-- =====================================================
             HEADER
        ====================================================== -->
        <header class="edit-profile-header">
            <button class="back-btn" onclick="goBack()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1>Warna Aksen</h1>
        </header>

        <!-- =====================================================
             MAIN
        ====================================================== -->
        <main class="edit-profile-container">

            <!-- ===== PREVIEW ===== -->
            <div class="settings-card">
                <div class="settings-item">
                    <div class="item-icon">
                        <i class="fa-solid fa-palette"></i>
                    </div>
                    <div class="item-content">
                        <div class="item-title">Preview Warna</div>
                        <div class="item-sub">Warna aksen saat ini</div>
                    </div>
                    <div class="item-value">
                        <span id="previewColor" class="preview-color-dot"></span>
                    </div>
                </div>
            </div>

            <!-- ===== PILIH WARNA ===== -->
            <div class="settings-card mt-3">
                <div class="settings-item">
                    <div class="item-icon">
                        <i class="fa-solid fa-brush"></i>
                    </div>
                    <div class="item-content">
                        <div class="item-title">Pilih Warna Aksen</div>
                        <div class="item-sub">Sesuaikan warna tema aplikasi</div>
                    </div>
                </div>

                <div class="color-grid" style="grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 20px;">
                    <div class="color-option" data-accent="indigo" style="background-color: #4338CA;"
                        onclick="pilihAksen(this, 'indigo')" title="Indigo">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div class="color-option" data-accent="rose" style="background-color: #BE123C;"
                        onclick="pilihAksen(this, 'rose')" title="Rose">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div class="color-option" data-accent="emerald" style="background-color: #047857;"
                        onclick="pilihAksen(this, 'emerald')" title="Emerald">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div class="color-option" data-accent="amber" style="background-color: #B45309;"
                        onclick="pilihAksen(this, 'amber')" title="Amber">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div class="color-option" data-accent="violet" style="background-color: #6D28D9;"
                        onclick="pilihAksen(this, 'violet')" title="Violet">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div class="color-option" data-accent="slate" style="background-color: #334155;"
                        onclick="pilihAksen(this, 'slate')" title="Slate">
                        <i class="fa-solid fa-check"></i>
                    </div>
                </div>
            </div>

            <!-- ===== TOMBOL SIMPAN ===== -->
            <button class="btn-submit mt-4" onclick="simpanAksen()">
                <i class="fa-solid fa-check"></i> Simpan Warna
            </button>

        </main>

        <!-- =====================================================
             BOTTOM NAV
        ====================================================== -->
        <nav class="bottom-nav">
            <a href="/index.html" class="active">
                <i class="fa-solid fa-house"></i>
                <span>Beranda</span>
            </a>
            <a href="/src/frontend/pages/activities/index.html">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Aktivitas</span>
            </a>
            <a href="/src/frontend/pages/qris.html" class="qr-nav">
                <div><i class="fa-solid fa-qrcode"></i></div>
            </a>
            <a href="/src/frontend/pages/product/index.html">
                <i class="fa-solid fa-store"></i>
                <span>Produk</span>
            </a>
            <a href="/src/frontend/pages/profile/account/index.html">
                <i class="fa-regular fa-user"></i>
                <span>Profil</span>
            </a>
        </nav>

    </div>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->
    <script src="../../../../assets/js/global.js"></script>
    <script src="../../../../assets/js/deptech-ui.js"></script>
    <script src="../../../../assets/js/deptech-settings.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof initAksen === 'function') {
                initAksen();
            }
        });
    </script>

</body>

</html>
