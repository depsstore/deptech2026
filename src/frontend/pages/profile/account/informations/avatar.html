<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DepTech</title>

    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Days+One&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="/src/frontend/assets/css/theme.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/global.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/server.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/deptech-ui.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/deptech-settings.css">

    <style>
        /* Preview avatar besar */
        .avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--accent), #3b82f6);
            color: white;
            font-size: 42px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            text-transform: uppercase;
        }

        /* Grid huruf A-Z */
        .letter-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        @media (min-width: 700px) {
            .letter-grid {
                grid-template-columns: repeat(8, 1fr);
            }
        }

        .letter-option {
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            background: var(--bg-soft);
            border: 2px solid transparent;
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: .2s;
            text-transform: uppercase;
            font-family: inherit;
            padding: 0;
        }

        .letter-option:hover {
            background: var(--bg-hover);
            border-color: var(--border-base);
        }

        .letter-option:active {
            transform: scale(.92);
        }

        .letter-option.active {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }

        /* Tab switch */
        .tab-switch {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: var(--bg-soft);
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .tab-switch button {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
            font-family: inherit;
        }

        .tab-switch button.active {
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>

<body class="has-canvas-bg">

    <canvas id="bgCanvas" class="bg-canvas"></canvas>

    <div class="min-h-screen pb-[90px] page-content">

        <!-- HEADER -->
        <header class="edit-profile-header">
            <button class="back-btn" onclick="goBack()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1>Foto Profil</h1>
        </header>

        <!-- MAIN -->
        <main class="edit-profile-container">

            <!-- PREVIEW -->
            <div style="text-align: center; margin-bottom: 24px;">
                <div class="avatar-preview" id="avatarPreview" data-avatar>?</div>
                <p style="font-size: 11px; color: var(--text-muted);">
                    Pilih tampilan foto profil Anda
                </p>
            </div>

            <!-- TAB SWITCH -->
            <div class="tab-switch">
                <button class="active" onclick="switchTab('letter')" id="tabLetter">
                    <i class="fa-solid fa-font"></i> Huruf
                </button>
                <button onclick="switchTab('photo')" id="tabPhoto">
                    <i class="fa-solid fa-image"></i> Foto
                </button>
            </div>

            <!-- TAB: HURUF -->
            <div id="panelLetter">
                <div class="settings-card">
                    <div class="settings-item" style="border-bottom: none; flex-direction: column; align-items: stretch; padding: 16px;">
                        <div style="font-size: 12px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px;">
                            Pilih huruf (A-Z)
                        </div>
                        <div class="letter-grid" id="letterGrid"></div>
                    </div>
                </div>
            </div>

            <!-- TAB: FOTO -->
            <div id="panelPhoto" style="display: none;">
                <div class="settings-card">
                    <div style="padding: 24px 16px; text-align: center;">
                        <div style="width: 64px; height: 64px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 12px;">
                            <i class="fa-solid fa-camera"></i>
                        </div>
                        <div style="font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px;">
                            Upload Foto
                        </div>
                        <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 16px;">
                            Format JPG, PNG. Maks 2MB.
                        </div>
                        <input type="file" id="photoInput" accept="image/*" style="display: none;">
                        <button class="btn-submit" onclick="document.getElementById('photoInput').click()" style="max-width: 200px; margin: 0 auto;">
                            <i class="fa-solid fa-upload"></i> Pilih Foto
                        </button>
                    </div>
                </div>
            </div>

            <!-- TOMBOL SIMPAN -->
            <button class="btn-submit" onclick="simpanAvatar()" style="margin-top: 16px;">
                <i class="fa-solid fa-check"></i> Simpan
            </button>

            <!-- TOMBOL RESET (kalau ada avatar custom) -->
            <button id="btnReset" class="btn-submit" onclick="resetAvatar()" style="margin-top: 8px; background: var(--danger-soft); color: var(--danger); display: none;">
                <i class="fa-solid fa-rotate-left"></i> Reset ke Nama
            </button>

        </main>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <a href="/index.html">
                <i class="fa-solid fa-house"></i>
                <span>Beranda</span>
            </a>
            <a href="/src/frontend/pages/activities/index.html">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Aktivitas</span>
            </a>
            <a href="/src/frontend/pages/qris.html" class="qr-nav">
                <div><i class="fa-solid fa-qrcode"></i></div>
            </a>
            <a href="/src/frontend/pages/product/index.html">
                <i class="fa-solid fa-store"></i>
                <span>Produk</span>
            </a>
            <a href="/src/frontend/pages/profile/account/index.html" class="active">
                <i class="fa-regular fa-user"></i>
                <span>Profil</span>
            </a>
        </nav>

    </div>

    <div class="toast" id="toast"></div>

    <!-- JS -->
    <script src="../../../../assets/js/store.js"></script>
    <script src="../../../../assets/js/global.js"></script>
    <script src="../../../../assets/js/avatar.js"></script>
    <script src="../../../../assets/js/deptech-ui.js"></script>
    <script src="../../../../assets/js/deptech-settings.js"></script>

    <script>
        var selected = {
            type: 'letter',
            value: '?'
        };

        document.addEventListener('DOMContentLoaded', function() {
            initLetterGrid();
            loadCurrentAvatar();
            setupPhotoInput();
        });

        // =====================================================
        // INIT GRID A-Z
        // =====================================================
        function initLetterGrid() {
            var grid = document.getElementById('letterGrid');
            var alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

            alphabet.forEach(function(letter) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'letter-option';
                btn.textContent = letter;
                btn.dataset.letter = letter;
                btn.onclick = function() {
                    selectLetter(letter);
                };
                grid.appendChild(btn);
            });
        }

        // =====================================================
        // LOAD AVATAR SAAT INI
        // =====================================================
        function loadCurrentAvatar() {
            if (typeof DeptechStore === 'undefined') return;

            var current = DeptechStore.getAvatarDisplay();

            if (current.type === 'letter') {
                selectLetter(current.value, false);
                switchTab('letter');
            } else if (current.type === 'photo') {
                selectPhoto(current.value);
                switchTab('photo');
            }

            // Cek apakah ada avatar custom (letter pilihan / foto)
            var custom = DeptechStore.getAvatar();
            if (custom) {
                document.getElementById('btnReset').style.display = 'block';
            }
        }

        // =====================================================
        // SELECT LETTER
        // =====================================================
        function selectLetter(letter, updatePreview) {
            if (updatePreview === undefined) updatePreview = true;

            selected = { type: 'letter', value: letter };

            // Update active state
            document.querySelectorAll('.letter-option').forEach(function(el) {
                el.classList.remove('active');
                if (el.dataset.letter === letter) el.classList.add('active');
            });

            if (updatePreview) updatePreviewAvatar();
        }

        // =====================================================
        // SELECT PHOTO
        // =====================================================
        function selectPhoto(dataUrl) {
            selected = { type: 'photo', value: dataUrl };
            updatePreviewAvatar();
        }

        // =====================================================
        // UPDATE PREVIEW
        // =====================================================
        function updatePreviewAvatar() {
            var preview = document.getElementById('avatarPreview');
            if (!preview) return;

            if (selected.type === 'photo' && selected.value) {
                preview.style.backgroundImage = 'url(' + selected.value + ')';
                preview.style.backgroundSize = 'cover';
                preview.style.backgroundPosition = 'center';
                preview.textContent = '';
            } else {
                preview.style.backgroundImage = '';
                preview.textContent = (selected.value || '?').toUpperCase();
            }
        }

        // =====================================================
        // SETUP PHOTO INPUT
        // =====================================================
        function setupPhotoInput() {
            var input = document.getElementById('photoInput');
            if (!input) return;

            input.addEventListener('change', function(e) {
                var file = e.target.files && e.target.files[0];
                if (!file) return;

                // Validasi ukuran (max 2MB)
                if (file.size > 2 * 1024 * 1024) {
                    showError('Ukuran foto maksimal 2MB');
                    input.value = '';
                    return;
                }

                // Validasi tipe
                if (!file.type.startsWith('image/')) {
                    showError('File harus berupa gambar');
                    input.value = '';
                    return;
                }

                var reader = new FileReader();
                reader.onload = function(ev) {
                    selectPhoto(ev.target.result);
                    showSuccess('Foto siap disimpan');
                };
                reader.onerror = function() {
                    showError('Gagal membaca foto');
                };
                reader.readAsDataURL(file);
            });
        }

        // =====================================================
        // SWITCH TAB
        // =====================================================
        function switchTab(tab) {
            var tabLetter = document.getElementById('tabLetter');
            var tabPhoto = document.getElementById('tabPhoto');
            var panelLetter = document.getElementById('panelLetter');
            var panelPhoto = document.getElementById('panelPhoto');

            if (tab === 'letter') {
                tabLetter.classList.add('active');
                tabPhoto.classList.remove('active');
                panelLetter.style.display = 'block';
                panelPhoto.style.display = 'none';
            } else {
                tabLetter.classList.remove('active');
                tabPhoto.classList.add('active');
                panelLetter.style.display = 'none';
                panelPhoto.style.display = 'block';
            }
        }

        // =====================================================
        // SIMPAN AVATAR
        // =====================================================
        function simpanAvatar() {
            if (typeof DeptechStore === 'undefined') return;

            if (selected.type === 'letter') {
                DeptechStore.setAvatar({ type: 'letter', value: selected.value });
            } else if (selected.type === 'photo' && selected.value) {
                DeptechStore.setAvatar({ type: 'photo', value: selected.value });
            } else {
                showError('Pilih avatar dulu');
                return;
            }

            // Log activity
            DeptechStore.logActivity({
                action: 'avatar_update',
                title: 'Foto Profil Diperbarui',
                description: 'Avatar diubah menjadi ' + selected.value,
                icon: 'fa-image',
                iconType: 'info'
            });

            showSuccess('Foto profil berhasil disimpan');

            setTimeout(function() {
                window.location.href = '/src/frontend/pages/profile/account/informations/pribadi.html';
            }, 800);
        }

        // =====================================================
        // RESET AVATAR
        // =====================================================
        function resetAvatar() {
            if (!confirm('Reset foto profil ke huruf nama?')) return;

            if (typeof DeptechStore !== 'undefined') {
                DeptechStore.clearAvatar();
            }

            showSuccess('Foto profil direset');
            setTimeout(function() {
                window.location.reload();
            }, 800);
        }
    </script>

</body>
</html>
