<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Title Default -->
    <title>DepTech</title>

    <!-- Theme Color (Light & Dark) -->
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#2563eb">

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="DepTech">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="DepTech - Platform digital untuk belanja & menabung">

    <!-- Icon -->
    <link rel="icon" type="image/png" href="/src/frontend/assets/img/brandnolatar.png">
    <link rel="apple-touch-icon" href="/src/frontend/assets/img/brandnolatar.png">

    <!-- Framework & Font -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Days+One&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/src/frontend/assets/css/theme.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/global.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/server.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/deptech-ui.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/deptech-settings.css">
</head>

<body class="has-canvas-bg">

    <canvas id="bgCanvas" class="bg-canvas"></canvas>

    <div class="edit-profile-page page-content">

        <header class="edit-profile-header">
            <button class="back-btn" onclick="window.location.href='pribadi.html'">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1>Ubah Nomor Ponsel</h1>
        </header>

        <div class="edit-profile-container">
            <div class="card-profile">
                <div class="label">Nomor Ponsel</div>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fa-solid fa-phone"></i></span>
                    <input type="tel" id="phoneNumber" placeholder="Masukkan nomor ponsel" maxlength="15">
                </div>
                <div class="helper-text">Masukkan nomor ponsel aktif untuk verifikasi</div>
                <button class="btn-simpan" onclick="simpanPhone()">Simpan Perubahan</button>
            </div>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script src="../../../../assets/js/store.js"></script>
    <script src="../../../../assets/js/global.js"></script>
    <script src="../../../../assets/js/deptech-ui.js"></script>
    <script src="../../../../assets/js/deptech-settings.js"></script>
    <script>
        // =====================================================
        // LOAD NOMOR DARI USER
        // =====================================================
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof DeptechStore === 'undefined') return;

            if (!DeptechStore.isLoggedIn()) {
                window.location.href = '../../auth/login.html';
                return;
            }

            var user = DeptechStore.getUser();
            var input = document.getElementById('phoneNumber');
            if (user && user.phone) input.value = user.phone;
        });

        // =====================================================
        // INPUT HANYA ANGKA
        // =====================================================
        var phoneInput = document.getElementById('phoneNumber');
        phoneInput.addEventListener('input', function () {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // =====================================================
        // SIMPAN NOMOR
        // =====================================================
        function simpanPhone() {
            var phone = phoneInput.value.trim();

            if (!phone) {
                showToast('Nomor ponsel wajib diisi!');
                phoneInput.focus();
                return;
            }
            if (phone.length < 10) {
                showToast('Nomor ponsel minimal 10 digit!');
                phoneInput.focus();
                return;
            }

            var btn = document.querySelector('.btn-simpan');
            btn.disabled = true;
            btn.textContent = 'Menyimpan...';

            setTimeout(function () {
                var user = DeptechStore.getUser() || {};
                user.phone = phone;
                DeptechStore.setUser(user);

                if (typeof DeptechStore.logActivity === 'function') {
                    DeptechStore.logActivity({
                        action: 'update_phone',
                        title: 'Nomor Ponsel Diperbarui',
                        description: 'Nomor diubah menjadi ' + phone,
                        icon: 'fa-phone',
                        iconType: 'info'
                    });
                }

                showToast('Nomor ponsel berhasil diperbarui!');
                btn.disabled = false;
                btn.textContent = 'Simpan Perubahan';
                setTimeout(function () { window.location.href = 'pribadi.html'; }, 500);
            }, 1000);
        }

        phoneInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') simpanPhone();
        });
    </script>

</body>

</html>
