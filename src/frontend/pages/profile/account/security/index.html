<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Title Default -->
    <title>DepTech</title>

    <!-- Theme Color (Light & Dark) -->
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#2563eb">

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="DepTech">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="DepTech - Platform digital untuk belanja & menabung">

    <!-- Icon -->
    <link rel="icon" type="image/png" href="/src/frontend/assets/img/brandnolatar.png">
    <link rel="apple-touch-icon" href="/src/frontend/assets/img/brandnolatar.png">

    <!-- Framework & Font -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Days+One&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/src/frontend/assets/css/theme.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/global.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/server.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/deptech-ui.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/deptech-settings.css">
</head>

<body class="has-canvas-bg">

    <canvas id="bgCanvas" class="bg-canvas"></canvas>

    <div class="edit-profile-page page-content">

        <header class="edit-profile-header">
            <button class="back-btn" onclick="window.location.href='../index.html'">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1>Keamanan</h1>
        </header>

        <div class="edit-profile-container">

            <div class="settings-card">
                <button class="settings-item" onclick="window.location.href='ubah-pin.html'">
                    <div class="item-icon"><i class="fa-solid fa-lock"></i></div>
                    <div class="item-content">
                        <div class="item-title">Ubah PIN</div>
                        <div class="item-sub">Ubah kode PIN keamanan Anda</div>
                    </div>
                    <i class="fa-solid fa-chevron-right item-arrow"></i>
                </button>

                <button class="settings-item" onclick="window.location.href='ubah-password.html'">
                    <div class="item-icon"><i class="fa-solid fa-key"></i></div>
                    <div class="item-content">
                        <div class="item-title">Ubah Password</div>
                        <div class="item-sub">Perbarui kata sandi akun Anda</div>
                    </div>
                    <i class="fa-solid fa-chevron-right item-arrow"></i>
                </button>

                <button class="settings-item" onclick="window.location.href='verifikasi-2langkah.html'">
                    <div class="item-icon"><i class="fa-solid fa-shield-halved"></i></div>
                    <div class="item-content">
                        <div class="item-title">Verifikasi 2 Langkah</div>
                        <div class="item-sub">Tambahkan lapisan keamanan ekstra</div>
                    </div>
                    <span class="item-value" id="status2FA">Nonaktif</span>
                    <i class="fa-solid fa-chevron-right item-arrow"></i>
                </button>

                <button class="settings-item" onclick="window.location.href='perangkat.html'">
                    <div class="item-icon"><i class="fa-solid fa-mobile-screen-button"></i></div>
                    <div class="item-content">
                        <div class="item-title">Perangkat Terdaftar</div>
                        <div class="item-sub">Kelola perangkat yang terhubung</div>
                    </div>
                    <span class="item-value" id="deviceCount"><span class="status-dot"></span> -</span>
                    <i class="fa-solid fa-chevron-right item-arrow"></i>
                </button>

                <button class="settings-item" onclick="window.location.href='riwayat-login.html'">
                    <div class="item-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
                    <div class="item-content">
                        <div class="item-title">Riwayat Login</div>
                        <div class="item-sub">Lihat aktivitas login akun Anda</div>
                    </div>
                    <i class="fa-solid fa-chevron-right item-arrow"></i>
                </button>
            </div>

            <div class="danger-zone">
                <div class="danger-title"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Danger Zone</div>
                <button class="settings-item" onclick="confirmLogoutAll()">
                    <div class="item-icon"><i class="fa-solid fa-right-from-bracket"></i></div>
                    <div class="item-content">
                        <div class="item-title">Logout Semua Perangkat</div>
                        <div class="item-sub">Keluar dari semua perangkat yang terhubung</div>
                    </div>
                    <i class="fa-solid fa-chevron-right item-arrow"></i>
                </button>
            </div>

        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script src="../../../../assets/js/store.js"></script>
    <script src="../../../../assets/js/global.js"></script>
    <script src="../../../../assets/js/deptech-ui.js"></script>
    <script src="../../../../assets/js/deptech-settings.js"></script>
    <script>
        // =====================================================
        // LOAD STATUS: COUNT DEVICE + 2FA
        // =====================================================
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof DeptechStore === 'undefined') return;

            // Count device unik
            var history = DeptechStore.getLoginHistory() || [];
            var unique = {};
            history.forEach(function(item) {
                unique[item.device || 'Unknown'] = true;
            });
            var count = Object.keys(unique).length;

            var deviceEl = document.getElementById('deviceCount');
            if (deviceEl) {
                deviceEl.innerHTML = '<span class="status-dot"></span> ' +
                    (count > 0 ? count + ' aktif' : 'Belum ada');
            }

            // Status 2FA
            var status2FA = localStorage.getItem('deptech_2fa') === 'true' ? 'Aktif' : 'Nonaktif';
            var statusEl = document.getElementById('status2FA');
            if (statusEl) statusEl.textContent = status2FA;
        });

        // =====================================================
        // LOGOUT SEMUA PERANGKAT
        // =====================================================
        function confirmLogoutAll() {
            if (!confirm('Apakah Anda yakin ingin keluar dari semua perangkat?')) return;

            if (typeof DeptechStore !== 'undefined') {
                DeptechStore.clearLoginHistory();
                DeptechStore.clearUser();
            }

            showToast('Berhasil logout dari semua perangkat');

            setTimeout(function () {
                window.location.href = '../auth/login.html';
            }, 1000);
        }
    </script>

</body>

</html>
