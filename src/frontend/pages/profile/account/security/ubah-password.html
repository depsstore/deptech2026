<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Title Default -->
    <title>DepTech</title>

    <!-- Theme Color (Light & Dark) -->
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#2563eb">

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="DepTech">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="DepTech - Platform digital untuk belanja & menabung">

    <!-- Icon -->
    <link rel="icon" type="image/png" href="/src/frontend/assets/img/brandnolatar.png">
    <link rel="apple-touch-icon" href="/src/frontend/assets/img/brandnolatar.png">

    <!-- Framework & Font -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Days+One&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/src/frontend/assets/css/theme.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/global.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/server.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/deptech-ui.css">
    <link rel="stylesheet" href="/src/frontend/assets/css/deptech-settings.css">
</head>

<body class="has-canvas-bg">

    <canvas id="bgCanvas" class="bg-canvas"></canvas>

    <div class="edit-profile-page page-content">

        <header class="edit-profile-header">
            <button class="back-btn" onclick="window.location.href='index.html'">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1>Ubah Password</h1>
        </header>

        <div class="edit-profile-container">
            <div class="card-profile">

                <div class="label">Password Lama</div>
                <div class="input-wrapper" style="margin-bottom: 16px;">
                    <span class="input-icon"><i class="fa-solid fa-key"></i></span>
                    <input type="password" id="oldPassword" placeholder="Masukkan password lama">
                    <button type="button" class="toggle-password" onclick="togglePassword(this)">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <div class="label">Password Baru</div>
                <div class="input-wrapper" style="margin-bottom: 16px;">
                    <span class="input-icon"><i class="fa-solid fa-key"></i></span>
                    <input type="password" id="newPassword" placeholder="Password baru (min 8 karakter)">
                    <button type="button" class="toggle-password" onclick="togglePassword(this)">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <div class="label">Konfirmasi Password Baru</div>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fa-solid fa-key"></i></span>
                    <input type="password" id="confirmPassword" placeholder="Ulangi password baru">
                    <button type="button" class="toggle-password" onclick="togglePassword(this)">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <div class="helper-text">Password minimal 8 karakter kombinasi huruf dan angka</div>

                <button class="btn-simpan" onclick="simpanPassword()">Simpan Password</button>
            </div>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script src="../../../../assets/js/store.js"></script>
    <script src="../../../../assets/js/global.js"></script>
    <script src="../../../../assets/js/deptech-ui.js"></script>
    <script src="../../../../assets/js/deptech-settings.js"></script>
    <script>
        function togglePassword(btn) {
            var input = btn.closest('.input-wrapper').querySelector('input');
            var icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }

        function simpanPassword() {
            var oldPass = document.getElementById('oldPassword').value.trim();
            var newPass = document.getElementById('newPassword').value.trim();
            var confirmPass = document.getElementById('confirmPassword').value.trim();

            if (!oldPass) { showToast('Masukkan password lama!'); return; }
            if (!newPass) { showToast('Masukkan password baru!'); return; }
            if (newPass.length < 8) { showToast('Password baru minimal 8 karakter!'); return; }
            if (newPass !== confirmPass) { showToast('Password baru tidak cocok!'); return; }
            if (oldPass === newPass) { showToast('Password baru harus berbeda!'); return; }

            if (typeof DeptechStore === 'undefined') return;

            var user = DeptechStore.getUser();
            if (!user) {
                window.location.href = '../../auth/login.html';
                return;
            }

            // Cek password lama di deptech_users
            var users = JSON.parse(localStorage.getItem('deptech_users') || '[]');
            var found = null;
            for (var i = 0; i < users.length; i++) {
                if (users[i].email === user.email) { found = users[i]; break; }
            }

            if (!found) {
                showToast('Akun tidak ditemukan');
                return;
            }

            if (found.password !== oldPass) {
                showToast('Password lama salah!');
                return;
            }

            var btn = document.querySelector('.btn-simpan');
            btn.disabled = true;
            btn.textContent = 'Menyimpan...';

            setTimeout(function () {
                // Update password di deptech_users
                found.password = newPass;
                localStorage.setItem('deptech_users', JSON.stringify(users));

                if (typeof DeptechStore.logActivity === 'function') {
                    DeptechStore.logActivity({
                        action: 'change_password',
                        title: 'Password Diubah',
                        description: 'Password akun berhasil diperbarui',
                        icon: 'fa-key',
                        iconType: 'security'
                    });
                }

                showToast('Password berhasil diperbarui!');
                btn.disabled = false;
                btn.textContent = 'Simpan Password';
                setTimeout(function () { window.location.href = 'index.html'; }, 500);
            }, 1000);
        }
    </script>

    <style>
        .input-wrapper { position: relative; }
        .toggle-password {
            position: absolute;
            right: 14px;
            background: transparent;
            border: 0;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
        }
    </style>

</body>

</html>
