       <script src="../assets/js/store.js"></script>
    <script src="../assets/js/global.js"></script>
    <script src="../assets/js/deptech-ui.js"></script>
    <script src="../assets/js/deptech-settings.js"></script>
    <script src="../assets/js/shared-helpers.js"></script>
    <script src="../assets/js/notifikasi.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            var container = document.getElementById('notifList');
            var badge = document.getElementById('notifCount');
            if (!container) return;

            function render() {
                var notifs = NotifStore.generateAll();

                if (notifs.length === 0) {
                    container.innerHTML =
                        '<div class="history-empty">' +
                        '<i class="fa-regular fa-bell-slash"></i>' +
                        '<p>Belum ada notifikasi</p>' +
                        '</div>';
                    if (badge) badge.textContent = '0 baru';
                    return;
                }

                var html = '';
                notifs.forEach(function(n) {
                    var unreadClass = n.unread ? ' unread' : '';
                    html +=
                        '<div class="settings-item notif-item' + unreadClass + '" data-id="' + n.id + '">' +
                        '<div class="item-icon notif-icon ' + n.iconType + '">' +
                        '<i class="fa-solid ' + n.icon + '"></i>' +
                        '</div>' +
                        '<div class="item-content">' +
                        '<div class="item-title">' + n.title + '</div>' +
                        '<div class="item-sub">' + n.message + '</div>' +
                        '<div class="item-time">' + NotifStore.formatRelative(n.date) + '</div>' +
                        '</div>' +
                        (n.unread ? '<span class="status-dot"></span>' : '') +
                        '</div>';
                });
                container.innerHTML = html;

                if (badge) badge.textContent = NotifStore.countUnread() + ' baru';

                // Klik → mark as read
                container.querySelectorAll('.notif-item.unread').forEach(function(item) {
                    item.addEventListener('click', function() {
                        NotifStore.markAsRead(this.dataset.id);
                        render();
                    });
                });
            }

            render();

            // Tombol "tandai semua dibaca" (tombol ke-2 dari kiri)
            var markAllBtn = document.getElementById('markAllBtn');
            if (markAllBtn) {
                markAllBtn.addEventListener('click', function() {
                    NotifStore.markAllAsRead();
                    render();
                    if (typeof showToast === 'function') showToast('Semua notifikasi ditandai dibaca');
                });
            }

        });
    </script>

</body>
